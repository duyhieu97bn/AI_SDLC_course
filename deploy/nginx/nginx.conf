# Nginx: kết thúc TLS, phục vụ SPA, định tuyến /api, /ws, /media (TS-02.2, SADD 3.3).
# Dev dùng chứng chỉ tự ký do scripts/dev.sh init sinh ra trong nginx/certs/.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Log JSON để Loki đọc chung định dạng với Core; request_id là correlationId gửi sang Core
    log_format json escape=json '{"ts":"$time_iso8601","app":"nginx","correlationId":"$request_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Giới hạn tốc độ chung cho API; S1 thêm vùng riêng chặt hơn cho /api/v1/auth
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    resolver 127.0.0.11 valid=10s ipv6=off;  # DNS nội bộ của Docker
    upstream core     { server core:8080; keepalive 32; }
    upstream mtx_whep { server mediamtx:8889; }
    upstream mtx_hls  { server mediamtx:8888; }
    upstream mtx_play { server mediamtx:9996; }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/camhub.crt;
        ssl_certificate_key /etc/nginx/certs/camhub.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Header bảo mật (TS-08, ASVS V14.4). Lưu ý: location nào có add_header riêng thì KHÔNG thừa kế các dòng này,
        # phải lặp lại (xem /assets/).
        # CSP: script chỉ từ cùng nguồn (bản build Vite không có script inline); worker/media "blob:" cho hls.js
        # (MediaSource) và ảnh "data:"/"blob:" cho mã QR 2FA, ảnh chụp; style inline cho thuộc tính style của Vue.
        set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        # Micro chỉ cho trang của CamHub (đàm thoại US-15); tắt các API thiết bị khác
        set $permissions "camera=(), geolocation=(), microphone=(self), payment=(), usb=()";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions always;

        client_max_body_size 20m;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Endpoint nội bộ (MediaMTX gọi Core) và actuator không bao giờ mở ra ngoài
        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # host:cổng như trình duyệt/Connector thấy (Core dựng URL đường hầm trả cho Site Connector)
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-Id $request_id;
            # Ghi đè, không nối thêm: Nginx là điểm vào duy nhất, X-Forwarded-For do client gửi là giả được và Core
            # lấy giá trị đầu tiên làm IP trong nhật ký kiểm toán. Có cân bằng tải phía trước thì dùng real_ip_header.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Điểm STOMP của Core là đúng /ws; "location /ws/" trả 301 cho /ws mà WebSocket không theo chuyển hướng
        location = /ws {
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Core kiểm tra Origin của bắt tay WebSocket (cùng nguồn): cần đúng scheme và host:cổng trình duyệt thấy
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 1h;
        }

        # Đường hầm Site Connector (ADR-10, TS-06.2): WebSocket tới chisel server (dịch vụ "tunnel").
        # chisel không quan tâm đường dẫn nên giữ nguyên /tunnel/. Dùng biến + resolver để Nginx vẫn khởi động
        # khi dịch vụ tunnel chưa chạy. Xác thực nằm ở chisel (tài khoản theo từng bộ kết nối do Core cấp).
        location /tunnel/ {
            set $tunnel_upstream http://tunnel:8080;
            proxy_pass $tunnel_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            # chisel gửi keepalive mỗi 25 giây; timeout dài để đường hầm rảnh không bị cắt
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Đàm thoại (US-15): trình duyệt gửi âm thanh qua WebSocket thẳng tới Device Gateway. Chỉ mở đúng
        # /talk/ws/<mã phiên>; mã phiên do Core cấp sau khi kiểm tra TALK_AUDIO, dùng một lần. REST /v1 của Gateway
        # không đi qua Nginx.
        location ^~ /talk/ws/ {
            set $gateway_upstream http://device-gateway:8000;
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 10m;
        }

        # WHEP: /media/webrtc/<path>/whep?token=... -> MediaMTX /<path>/whep
        location /media/webrtc/ {
            proxy_pass http://mtx_whep/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # MediaMTX trả Location dạng /<path>/whep/<phiên>; thêm tiền tố để trình duyệt gọi lại qua Nginx
            proxy_redirect / /media/webrtc/;
            proxy_buffering off;
        }

        location /media/hls/ {
            proxy_pass http://mtx_hls/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location /media/playback/ {
            proxy_pass http://mtx_play/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # SPA: mọi đường dẫn khác trả index.html để Vue Router xử lý
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Source map chỉ dùng khi gỡ lỗi, không phát ra ngoài (lộ mã nguồn, TS-08)
        location ~ \.map$ { return 404; }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy $csp always;
        }
    }
}
