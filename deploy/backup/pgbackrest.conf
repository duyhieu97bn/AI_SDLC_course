# Cấu hình pgBackRest của CamHub (US-40.1). Dùng chung cho container postgres (archive-push)
# và container backup (stanza-create, backup, expire, info). Kho (repo1) nằm trên volume "pgbackrest".
#
# Production: kho phải nằm NGOÀI máy chủ CSDL – thêm repo2 trỏ tới S3/NAS off-site và bật mã hóa:
#   repo2-type=s3, repo2-s3-bucket=..., repo2-s3-endpoint=..., repo2-path=/camhub
#   repo2-cipher-type=aes-256-cbc (mật khẩu đặt qua biến PGBACKREST_REPO2_CIPHER_PASS, không ghi vào file này)
#   repo2-retention-full=30
# Xem docs/runbook/restore.md.

[global]
repo1-path=/var/lib/pgbackrest
# Giữ 30 bản đầy đủ (≈ 30 ngày với lịch 1 bản/ngày); bản differential và WAL hết hạn theo bản đầy đủ của nó
repo1-retention-full-type=count
repo1-retention-full=30
# Gom file nhỏ và sao lưu theo khối: bản differential hằng giờ nhỏ và nhanh
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=2
# Checkpoint ngay khi bắt đầu sao lưu thay vì chờ checkpoint định kỳ
start-fast=y

log-level-console=info
log-level-stderr=off
log-level-file=off

[global:archive-push]
compress-level=1
# Không ghi log mỗi lần đẩy WAL vào log của PostgreSQL, chỉ cảnh báo/lỗi
log-level-console=warn

[camhub]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
# Cụm được khởi tạo với POSTGRES_USER=camhub nên superuser là camhub (không có role postgres)
pg1-user=camhub
