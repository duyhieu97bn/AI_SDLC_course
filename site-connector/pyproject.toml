[project]
name = "camhub-site-connector"
version = "0.1.0"
description = "CamHub Site Connector: agent tại địa điểm, mở đường hầm WSS 443 ra máy chủ (ADR-10, SADD 3.3, US-24)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "types-defusedxml>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[project.scripts]
camhub-connector = "site_connector.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["site_connector"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Mật khẩu giả trong test
"tests/**" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["site_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
