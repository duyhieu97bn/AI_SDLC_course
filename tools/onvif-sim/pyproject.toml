[project]
name = "camhub-onvif-sim"
version = "0.1.0"
description = "Bộ giả lập camera ONVIF cho phát triển và kiểm thử tương thích CamHub (TS-05.4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onvif_sim"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]
# Bộ giả lập có tài khoản mặc định cho môi trường dev
ignore = ["S101", "S105", "S106", "S107"]
